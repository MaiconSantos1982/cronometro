<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro Musical</title>
    
    <link href="https://cdn.jsdelivr.net/npm/[email protected]/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/[email protected]/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        .btn-control-mini {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background-color: #212121;
            color: #1db954; /* Verde Spotify */
            font-size: 20px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-control-mini:hover {
            background-color: #333;
            transform: scale(1.1);
            color: #1ed760;
        }
        .btn-control-mini:active {
            transform: scale(0.95);
        }
        .play-spotify {
            font-size: 28px;
            width: 55px;
            height: 55px;
        }
    </style>
</head>
<body>
    <div class="main-container text-center pt-5">
        <div class="stopwatch-content d-inline-block">
            <div class="display-area mb-4">
                <span id="minutes">00</span>:<span id="seconds">00</span>,<span id="milliseconds">00</span>
            </div>
            
            <div class="buttons-row d-flex justify-content-center gap-3">
                <button class="btn-control" onclick="reset()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                    </svg>
                </button>
                
                <button class="btn-control btn-start" onclick="startPause()">
                    <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="34" height="34" fill="currentColor" viewBox="0 0 16 16">
                        <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
                    </svg>
                    <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" width="34" height="34" fill="currentColor" viewBox="0 0 16 16" style="display: none;">
                        <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>
                    </svg>
                </button>
                
                <button class="btn-control" onclick="stop()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5A1.5 1.5 0 0 1 5 3.5z"/>
                    </svg>
                </button>
            </div>

            <div class="spotify-controls mt-5 pt-4 border-top border-secondary">
                
                <div id="login-area">
                    <button onclick="spotifyLogin()" class="btn btn-success btn-sm rounded-pill px-4 fw-bold">
                        <i class="bi bi-spotify me-2"></i> Conectar Spotify
                    </button>
                </div>

                <div id="player-controls" style="display: none;" class="justify-content-center gap-3 align-items-center">
                    <button class="btn btn-control-mini" onclick="spotifyCommand('previous')">
                        <i class="bi bi-skip-start-fill"></i>
                    </button>
                    
                    <button class="btn btn-control-mini play-spotify" onclick="spotifyCommand('play')">
                        <i class="bi bi-play-circle-fill"></i>
                    </button>
                    
                    <button class="btn btn-control-mini" onclick="spotifyCommand('next')">
                        <i class="bi bi-skip-end-fill"></i>
                    </button>
                </div>
                
                <div id="track-info" class="mt-3 text-white-50 small" style="min-height: 20px; font-family: sans-serif;"></div>
            </div>
            </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
